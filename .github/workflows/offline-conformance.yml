# Offline conformance.
#
# This workflow proves FILE SHAPE and DETERMINISM: that bootstrap materializes
# the declared tree on three operating systems, that the generated files match
# their sources byte for byte, that the offline doctors and lints pass, and
# that a fresh clone reaches a clean state with zero hand edits.
#
# It never proves RUNTIME BEHAVIOR. No job launches Claude Code, Codex CLI, or
# OpenCode, touches the network for a runtime, or observes a hook firing inside
# a session. Runtime evidence lives only in docs/VERIFICATION.md rows that a
# person recorded after running a runtime and watching the outcome.
#
# Every job is named by what it proves.

name: Offline conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  shape-and-determinism:
    name: Bootstrap, doctors, lint, and regeneration are deterministic (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          # Proves the documented 3.11+ floor, not only the newer default above.
          - os: ubuntu-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python is real CPython (no version substitution anywhere in this workflow)
        run: python -c "import sys, json; print(sys.version)"

      - name: Install pytest (test runner only; no other packages)
        run: python -m pip install --disable-pip-version-check pytest

      - name: Bootstrap materializes the declared tree (POSIX)
        if: runner.os != 'Windows'
        run: bash harness/bootstrap/bootstrap.sh

      - name: Bootstrap materializes the declared tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File harness/bootstrap/bootstrap.ps1

      - name: Bootstrap --check reports no drift right after bootstrap (POSIX)
        if: runner.os != 'Windows'
        run: bash harness/bootstrap/bootstrap.sh --check

      - name: Bootstrap -Check reports no drift right after bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File harness/bootstrap/bootstrap.ps1 -Check

      - name: Seeded drift is detected by bootstrap --check (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          cp .claude/settings.json "$RUNNER_TEMP/settings.json.bak"
          printf '\n' >> .claude/settings.json
          if bash harness/bootstrap/bootstrap.sh --check; then
            echo "expected --check to exit 1 on seeded drift"; exit 1
          fi
          cp "$RUNNER_TEMP/settings.json.bak" .claude/settings.json
          bash harness/bootstrap/bootstrap.sh --check

      - name: Claude doctor passes offline (POSIX)
        if: runner.os != 'Windows'
        run: bash harness/bootstrap/doctor.sh

      - name: Claude doctor passes offline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File harness/bootstrap/doctor.ps1

      - name: Codex and OpenCode doctors pass offline
        run: |
          python harness/bootstrap/doctor_codex.py --offline
          python harness/bootstrap/doctor_opencode.py --offline

      - name: Strict lint passes
        run: python harness/tools/lint.py --strict

      - name: Resolver routes every trigger to an existing skill
        run: python harness/tools/resolver_lint.py

      - name: Generated files match their sources
        run: |
          python harness/tools/gen_manifest.py --check
          python harness/tools/native_routing.py render --check
          python harness/bootstrap/build_codex_adapter.py --check
          python harness/bootstrap/build_opencode_adapter.py --check

      - name: Every generated runtime JSON validates against its schema
        run: python harness/tools/lint.py --schemas

      - name: Seeded comment key in runtime JSON is rejected by strict validation
        shell: bash
        run: |
          set -e
          f=.claude/settings.json
          cp "$f" "$RUNNER_TEMP/seed.bak"
          python - "$f" <<'EOF'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p, encoding="utf-8"))
          d["_comment"] = "seeded"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2)
          EOF
          if python harness/tools/lint.py --schemas; then
            echo "expected --schemas to fail on a seeded _comment key"; exit 1
          fi
          cp "$RUNNER_TEMP/seed.bak" "$f"

      - name: Tests pass under pytest
        run: python -m pytest harness -q -p no:cacheprovider

      - name: Tests pass under the unittest fallback (Linux proof; pytest may be absent elsewhere)
        if: runner.os == 'Linux'
        run: python -m unittest discover -s harness -p "test_*.py" -v

      - name: POSIX shell syntax parses
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find harness .githooks -type f \( -name '*.sh' -o -name 'pre-commit' \) -print0 | xargs -0 -n1 sh -n

      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem harness -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors) { $errors | Format-List; exit 1 }

      - name: Secret scan over the whole tree via the pre-commit script
        shell: bash
        run: |
          set -e
          git add -A
          sh .githooks/pre-commit
          git reset -q

      - name: No generated runtime config widens the permission posture
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, sys
          roots = [".claude", ".codex", ".opencode", ".agents", "harness/adapters", "opencode.json"]
          bad = []
          for r in roots:
              p = pathlib.Path(r)
              files = [p] if p.is_file() else (p.rglob("*") if p.exists() else [])
              for f in files:
                  # the schema's forbidding clause and the tests that assert on it
                  # name these keys on purpose; they are the enforcement, not a posture
                  if f.name == "schema.json" or "tests" in f.parts:
                      continue
                  if f.is_file() and f.suffix in {".json", ".toml", ".yml", ".yaml", ".md"}:
                      t = f.read_text(encoding="utf-8", errors="replace")
                      if "bypassPermissions" in t or "skipDangerousModePermissionPrompt" in t:
                          bad.append(str(f))
          if bad:
              print("permission posture widened in:", *bad, sep="\n  ")
              sys.exit(1)
          print("permission posture minimal")
          EOF

      - name: De-identification lint is clean
        run: python harness/tools/deidentify_lint.py . --structural

      - name: Tracked tree is unchanged after bootstrap and regeneration
        run: |
          git diff --check
          git diff --exit-code

  copy-mode:
    name: Copy mode materializes a tree the three doctors accept (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest (test runner only; no other packages)
        run: python -m pip install --disable-pip-version-check pytest
      - name: Bootstrap --copy
        run: bash harness/bootstrap/bootstrap.sh --copy
      - name: Bootstrap --check accepts the copied tree
        run: bash harness/bootstrap/bootstrap.sh --check
      - name: Three doctors pass offline on the copied tree
        run: |
          bash harness/bootstrap/doctor.sh
          python harness/bootstrap/doctor_codex.py --offline
          python harness/bootstrap/doctor_opencode.py --offline
      - name: OpenCode plugin resolves its imports and exports on the copied tree
        run: python -m pytest harness/adapters/tests/test_plugin_exports.py -q -p no:cacheprovider

  fresh-template:
    name: A fresh clone bootstraps to a clean tree with zero hand edits (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest (test runner only; no other packages)
        run: python -m pip install --disable-pip-version-check pytest
      - name: Clone this checkout into a temp dir and bootstrap it there
        shell: bash
        run: |
          set -e
          dst="$RUNNER_TEMP/fresh-template"
          git clone -q "$GITHUB_WORKSPACE" "$dst"
          cd "$dst"
          bash harness/bootstrap/bootstrap.sh
          bash harness/bootstrap/bootstrap.sh --check
          bash harness/bootstrap/doctor.sh
          python harness/bootstrap/doctor_codex.py --offline
          python harness/bootstrap/doctor_opencode.py --offline
      - name: Fresh clone's tracked tree is clean (only ignored links may exist)
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/fresh-template"
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "fresh clone is dirty after bootstrap:"; echo "$status"; exit 1
          fi
          echo "clean"

      - name: A real git commit is refused through core.hooksPath (proves the executable bit, not just "sh pre-commit" by hand)
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/fresh-template"
          git config user.email "ci@example.com"
          git config user.name "CI"
          # Assemble the AKIA-shaped bait at runtime from fragments: a literal
          # of this shape in the workflow file would itself be flagged by the
          # pre-commit secret scan, which also reads this file.
          prefix="AK""IA"
          suffix=$(python -c "import random,string;print(''.join(random.choice(string.ascii_uppercase+string.digits) for _ in range(16)))")
          printf '%s%s\n' "$prefix" "$suffix" > bait.txt
          git add bait.txt
          if git commit -q -m "seeded bait: must be refused"; then
            echo "expected the commit to be refused by core.hooksPath"; exit 1
          fi
          if git log --oneline -1 | grep -q "seeded bait"; then
            echo "the refused commit landed anyway"; exit 1
          fi
          git reset -q
          rm -f bait.txt
          echo "commit correctly refused"
